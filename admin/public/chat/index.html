<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0"
  />
  <title>在线客服</title>
  <link rel="stylesheet" href="chat.css" />
</head>
<body style="margin:0;background:#f5f6f8;">
  <div id="xservice-chat"></div>
  <script src="vendor/marked.js"></script>
  <script src="chat.js"></script>
  <script>
    /**
     * 访客端全屏聊天页 / iframe 内容页
     *
     * URL 参数：
     *   apiUrl   后端 API 地址（默认当前 origin，生产环境可省略）
     *   wsUrl    WebSocket 地址（默认由 apiUrl 推导）
     *   source   来源：1网页 2弹窗 3iframe（默认按 embed 参数判定）
     *   embed=1  表示以 iframe 形式嵌入，隐藏重复的顶部入口条
     *   channel  嵌入渠道 id（安全模式：从父页面 postMessage 获取 session token）
     *   preview=1 预览模式：仅渲染界面与演示对话，不注册访客、不建会话、不连 WS，
     *             避免管理端在 embed 配置页预览时产生真实的待接入会话。
     *
     * session token（ems_…）：
     *   带 channel 时，本页初始化时会自动调 /im/embed/issue 用 channelId 换取短期
     *   token 并自动续期（域名白名单+限流在后端校验）。若作为浮窗 iframe 运行，
     *   父页面（widget.js）也可能通过 postMessage 传入 token，收到后会覆盖并重置续期。
     */
    (function () {
      var params = new URLSearchParams(location.search);
      var apiUrl = params.get('apiUrl') || location.origin;
      var wsUrl = params.get('wsUrl') || '';
      var embed = params.get('embed') === '1';
      var source = parseInt(params.get('source'), 10) || (embed ? 3 : 1);
      var channelId = params.get('channel');
      var preview = params.get('preview') === '1';
      var bare = params.get('bare') === '1';

      var core = new window.XServiceChatCore({
        apiUrl: apiUrl,
        wsUrl: wsUrl,
        source: source,
        channel: channelId || '',
        preview: preview,
        bare: bare,
        container: document.getElementById('xservice-chat'),
      });
      core.init();

      // 浮窗模式下，父页面（widget.js）换得 token 后通过 postMessage 注入，收到即覆盖
      if (channelId) {
        window.addEventListener('message', function (e) {
          if (!e.data || e.data.source !== 'xservice-widget') return;
          if (e.data.type === 'session_token' && e.data.token && core.setSessionToken) {
            core.setSessionToken(e.data.token);
          }
        });
      }
    })();
  </script>
</body>
</html>
