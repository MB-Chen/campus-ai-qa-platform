server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;  # 关键：解决 Vue Router 404 问题
    }

    # 校园智能问答平台 API 代理（转发到后端 7026）
    location /api/campus/ {
        proxy_pass http://backend:7026/api/campus/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header token $http_token;
    }

    # 健康检查代理
    location /actuator/ {
        proxy_pass http://backend:7026/actuator/;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}