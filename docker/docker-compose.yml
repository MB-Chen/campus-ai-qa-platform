# SparkX 全量依赖编排：postgres + minio + mineru + backend + frontend
#
# 仅启动依赖服务（不启动 backend/frontend）：
#   docker compose up -d postgres minio mineru
#
# 自建 MinerU 需 GPU，且镜像较大。无 GPU 环境请：
#   1) 用云端 MinerU（后台「知识库 → 外部服务配置」新增 category=mineru_cloud），跳过本服务；
#   2) 或临时注释下方 mineru 服务块。
#
# 国内拉取：MinerU/MinIO 均走 docker.1ms.run 加速源，避免 Docker Hub 直连超时。
# 如已有本地镜像或自建 registry，把 image 改回 opendatalab/mineru:latest / minio/minio 即可。
services:
  postgres:
    image: crpi-35xwxmfks2ouwnqn.cn-shanghai.personal.cr.aliyuncs.com/sparkx/pgvector:15
    container_name: sparkx-postgres
    environment:
      POSTGRES_USER: sparkx
      POSTGRES_PASSWORD: 123123
      POSTGRES_DB: sparkx
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./sql/sparkx.sql:/docker-entrypoint-initdb.d/sparkx.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkx -d sparkx"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 企业云盘 MinIO 对象存储（sparkx-drive bucket）
  # 与 application.yml 的 sparkx.minio.* 对齐：
  #   endpoint  http://127.0.0.1:9000   access/secret  minioadmin   bucket  sparkx-drive
  minio:
    # 国内镜像加速源 docker.1ms.run（绕开 Docker Hub 直连超时 + mirror 配置不生效问题）
    image: docker.1ms.run/minio/minio
    container_name: sparkx-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    ports:
      - "9000:9000"   # S3 API（sparkx 后端连接）
      - "9001:9001"   # Web Console（http://localhost:9001）
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首次启动自动创建 sparkx-drive bucket（幂等，已存在则跳过）。
  # 用官方 mc 客户端连本编排内的 minio 服务，跑完即退出。
  minio-init:
    image: docker.1ms.run/minio/mc
    container_name: sparkx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/sparkx-drive;
      mc anonymous set download local/sparkx-drive;
      echo '[minio-init] bucket sparkx-drive ready';
      "
    restart: "no"

  # 自建 MinerU 文档解析服务（PDF/图片 → Markdown）
  # sparkx 后端在「外部服务配置」中按 category=mineru_self 读取 endpoint 调用：
  #   endpoint = http://127.0.0.1:8000   （MinerUConfig 的 SSRF 白名单对本机回环放行）
  # 镜像基于 vllm，需 NVIDIA GPU。无 GPU 改用云端 mineru_cloud。
  mineru:
    # 官方镜像在国内拉取易超时，走加速源；自建 registry 可改回 opendatalab/mineru:latest
    image: docker.1ms.run/opendatalab/mineru:latest
    container_name: sparkx-mineru
    profiles: ["api"]          # 用 profile 隔离：默认 docker compose up 不启动，需 --profile api
    ports:
      - "8000:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      - --host=0.0.0.0
      - --port=8000
      # 绑定 0.0.0.0 后默认禁用 *-http-client 后端的 server_url。
      # sparkx 自建同机部署时后端走 127.0.0.1，SSRF 校验放行；
      # 若要用 vlm-http-client/hybrid-http-client，取消下行注释并知悉 SSRF 风险：
      # - --allow-public-http-client
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s       # vllm 模型加载慢，首次健康检查放宽
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # 多卡改为 ["0","1"]
              capabilities: [gpu]

  backend:
    image: crpi-35xwxmfks2ouwnqn.cn-shanghai.personal.cr.aliyuncs.com/sparkx/sparkx-backend:1.1.5
    container_name: sparkx-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sparkx
      SPRING_DATASOURCE_USERNAME: sparkx
      SPRING_DATASOURCE_PASSWORD: 123123
      # MinIO 连接地址（application.yml 默认 http://127.0.0.1:9000）：
      #   - 后端在宿主机裸跑 / backend 容器用 host 网络：保持默认即可（minio 端口已映射到宿主机 9000）。
      #   - backend 也在本 compose 网络内（bridge）：需改用服务名，但 MinIO 预签名 URL 会带该 host，
      #     浏览器/前端无法解析，故一般仍建议经宿主机端口访问。按需取消下行注释：
      # SPARKX_MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8989:8989"

  frontend:
    image: crpi-35xwxmfks2ouwnqn.cn-shanghai.personal.cr.aliyuncs.com/sparkx/sparkx-frontend:1.1.5
    container_name: sparkx-frontend
    ports:
      - "8189:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/config.js:/usr/share/nginx/html/config.js
volumes:
  pg-data:
