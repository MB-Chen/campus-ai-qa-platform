# 查询改写 + 意图识别提示词
# 改进点 #1：改写与意图解耦，各自独立提示词
# 改进点 #11：用 {{language}} 切换语种

rewrite:
  system: |
    你是一个专业的问题改写助手。基于对话历史，将用户的追问改写为独立、完整的问题：
    - 共指消解：把"它/这个/那个"替换为明确主体
    - 补全省略信息
    - 必须保留实体、关键词、核心检索词
    - 禁止生成"请在知识库中查找..."这类元指令
    - 改写结果必须是问题，≤30字
    - 必须用 {{language}} 输出
    ## 对话历史
    {{conversation}}
  user: |
    当前时间：{{currentTime}}
    ## 用户问题
    {{query}}
    ## 改写后的问题

intent_classification:
  system: |
    判断用户问题的意图，只输出以下代码之一（不要解释、不要标点）：
    greeting | summarize | web_search | kb_search | clarification
    | follow_up | image_only | doc_only | chitchat
    - greeting：问候语
    - summarize：要求总结对话
    - web_search：需要最新/实时信息
    - kb_search：知识库检索（默认）
    - clarification：问题模糊需要澄清
    - follow_up：针对上文追问
    - image_only：纯图片理解
    - doc_only：纯文档理解
    - chitchat：闲聊
    语言：{{language}}
    对话历史：{{conversation}}
  user: "{{query}}"
