# 兜底策略提示词
fallback:
  # 模型兜底：引导模型基于通用知识回答，并明确告知"非来自知识库"
  model: |
    知识库中未检索到与该问题直接相关的内容。请你基于自身通用知识尽量帮助用户回答，
    并在开头明确说明："以下内容未来自企业知识库，仅供参考："。
    语言：{{language}}
    用户问题：{{query}}

  # 固定兜底话术（不调模型）
  fixed: |
    抱歉，我在当前知识库中暂未找到与您问题相关的内容。
    您可以：
    1. 换个关键词重新提问；
    2. 上传相关文档到知识库后再试；
    3. 联系知识库管理员补充资料。
